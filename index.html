<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmandir Sahib Amritvela</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel to compile React JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gradient-to-b from-sky-100 via-amber-50/50 to-white min-h-screen text-slate-800 font-sans">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- YOUR GOOGLE SCRIPT WEB APP URL ---
        const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbwy3zfHhikZSKwup6PJgpa_0kD8jdSY7mNEe1VyM_SfHH4LB2fXRSyF5I7y0p72QB7nCQ/exec"; 

        // --- Icons ---
        const IconRefresh = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>;
        const IconSparkles = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1-1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>;
        const IconCheck = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
        const IconBell = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>;
        const IconPlay = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
        const IconInfo = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;
        const IconRadio = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="2"></circle><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48 0a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"></path></svg>;

        const App = () => {
            const [isLoading, setIsLoading] = useState(true);
            const [ardaasData, setArdaasData] = useState({ time: '--:--', daysActive: 0 });
            const [isRefreshing, setIsRefreshing] = useState(false);
            const [errorMsg, setErrorMsg] = useState(null);
            const [showPlayer, setShowPlayer] = useState(false);

            const performFetch = async () => {
                try {
                    const cacheBusterUrl = `${GOOGLE_API_URL}?nocache=${new Date().getTime()}`;
                    const response = await fetch(cacheBusterUrl, { 
                        redirect: "follow",
                        cache: "no-store" 
                    });
                    
                    const textData = await response.text();
                    
                    if (textData.trim().startsWith("<")) {
                        setErrorMsg("Google Access Denied. You must deploy your Apps Script with 'Who has access: Anyone'");
                        setArdaasData({ time: 'Error', daysActive: 0 });
                    } else {
                        const data = JSON.parse(textData);
                        setArdaasData({ time: data.time || "--:--", daysActive: data.daysActive || 0 });
                        setErrorMsg(null);
                    }
                } catch (error) {
                    console.error("Failed to fetch routine:", error);
                    setErrorMsg("Network Error: Make sure your Google Apps Script Web App URL is correct.");
                    setArdaasData({ time: 'Error', daysActive: 0 });
                } finally {
                    setIsLoading(false);
                    setIsRefreshing(false);
                }
            };

            useEffect(() => {
                // Initial Fetch
                performFetch();

                // 🌐 GODMODE: The "Stale Screen" Fix 
                // Listens for whenever you unlock your phone or switch back to the app and forces a live reload!
                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'visible') {
                        setIsRefreshing(true);
                        performFetch();
                    }
                };

                document.addEventListener("visibilitychange", handleVisibilityChange);
                
                // Cleanup listener on unmount
                return () => document.removeEventListener("visibilitychange", handleVisibilityChange);
            }, []);

            const handleRefresh = () => {
                setIsRefreshing(true);
                performFetch();
            };

            return (
                <div className="p-4 sm:p-6 flex justify-center items-center">
                    <div className="w-full max-w-sm space-y-6 relative z-10">
                        
                        {/* Header */}
                        <div className="flex justify-between items-center px-2 pt-2">
                            <div>
                                <h1 className="text-amber-700 font-bold text-xl tracking-wide font-serif">Sri Harmandir Sahib</h1>
                                <p className="text-sky-700/80 text-xs uppercase tracking-widest font-semibold mt-0.5">Amritvela Routine</p>
                            </div>
                            <button onClick={handleRefresh} className={`p-2.5 rounded-full bg-white shadow-sm border border-amber-100 hover:bg-amber-50 hover:shadow transition-all ${isRefreshing ? 'animate-spin text-amber-500' : 'text-amber-700/60'}`}>
                                <IconRefresh className="w-5 h-5" />
                            </button>
                        </div>

                        {/* Hero Section */}
                        <div className="relative group mt-6">
                            <div className="absolute -inset-1 bg-gradient-to-b from-amber-200 to-amber-400 rounded-[2rem] blur-md opacity-40 group-hover:opacity-60 transition duration-700"></div>
                            <div className="relative bg-gradient-to-b from-white to-amber-50 border border-amber-200/60 rounded-[2rem] p-8 text-center shadow-xl flex flex-col items-center">
                                <IconSparkles className="w-8 h-8 text-amber-500 mx-auto mb-3" />
                                <p className="text-amber-800/80 text-sm font-semibold uppercase tracking-wider mb-2">First Ardas Timing</p>
                                
                                {isLoading ? (
                                    <div className="h-16 flex justify-center items-center">
                                        <div className="w-8 h-8 border-4 border-amber-200 border-t-amber-500 rounded-full animate-spin"></div>
                                    </div>
                                ) : (
                                    <div className="text-5xl font-black text-slate-800 tracking-tight my-2 font-serif">
                                        {ardaasData.time}
                                    </div>
                                )}

                                {errorMsg && (
                                    <div className="mt-4 bg-red-50 border border-red-200 text-red-600 text-xs font-bold p-3 rounded-xl max-w-[250px] leading-relaxed shadow-sm">
                                        {errorMsg}
                                    </div>
                                )}

                                {!isLoading && !errorMsg && (
                                    <div className="mt-6 flex justify-center">
                                        <div className={`px-4 py-1.5 rounded-full text-xs font-bold flex items-center gap-2 border shadow-sm ${ardaasData.daysActive === 0 ? 'bg-amber-100 border-amber-300 text-amber-800' : 'bg-white border-slate-200 text-slate-500'}`}>
                                            {ardaasData.daysActive === 0 ? (
                                                <><IconCheck className="w-4 h-4 text-amber-600" /> Changed Today!</>
                                            ) : (
                                                `Active for ${ardaasData.daysActive} days`
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Automatic Calendar Notification Info Box */}
                        <div className="bg-emerald-50 border border-emerald-100 rounded-2xl p-5 flex items-start gap-4 shadow-sm mt-4">
                            <div className="bg-white p-2.5 rounded-xl text-emerald-600 shadow-sm border border-emerald-100">
                                <IconBell className="w-6 h-6" />
                            </div>
                            <div>
                                <h3 className="text-slate-800 font-bold text-sm">Alarms Synced Natively</h3>
                                <p className="text-slate-600 text-xs mt-1.5 leading-relaxed">
                                    Your backend script will automatically push an alert to your Google Calendar <strong className="text-emerald-700">5 minutes prior</strong> to Ardaas.
                                </p>
                            </div>
                        </div>

                        {/* Action Buttons (New Player Setup) */}
                        <div className="grid grid-cols-2 gap-4">
                            <button onClick={() => setShowPlayer(!showPlayer)} className="bg-white hover:bg-slate-50 border border-slate-200 shadow-sm rounded-2xl p-4 flex flex-col items-center justify-center gap-3 transition-all group cursor-pointer">
                                <div className={`${showPlayer ? 'bg-red-50' : 'bg-emerald-50'} p-2 rounded-full transition-colors`}>
                                    <IconRadio className={`w-5 h-5 ${showPlayer ? 'text-red-600' : 'text-emerald-600'}`} />
                                </div>
                                <span className="text-xs font-bold text-slate-600 text-center">
                                    {showPlayer ? "Close Player" : "In-App Player"}
                                </span>
                            </button>
                            
                            <button onClick={() => window.open("https://www.youtube.com/@sgpcnet/live", "_blank")} className="bg-white hover:bg-slate-50 border border-slate-200 shadow-sm rounded-2xl p-4 flex flex-col items-center justify-center gap-3 transition-all group cursor-pointer">
                                <div className="bg-amber-50 p-2 rounded-full group-hover:bg-amber-100 transition-colors">
                                    <IconPlay className="w-5 h-5 text-amber-600" />
                                </div>
                                <span className="text-xs font-bold text-slate-600 text-center">Open YouTube<br/>App</span>
                            </button>
                        </div>

                        {/* Embeddable Live Player */}
                        {showPlayer && (
                            <div className="bg-black rounded-2xl overflow-hidden shadow-xl border border-slate-200 animate-fade-in">
                                <iframe 
                                    width="100%" 
                                    height="200" 
                                    src="https://www.youtube.com/embed/live_stream?channel=UCRp_L835_0w2rP_tA6-oZPA&autoplay=1" 
                                    frameBorder="0" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowFullScreen
                                    className="w-full"
                                ></iframe>
                            </div>
                        )}

                        {/* Routine List (Anand Sahib & Ardaas Only) */}
                        <div className="bg-white border border-slate-100 rounded-3xl p-6 shadow-sm">
                            <h4 className="text-xs font-extrabold text-amber-800/60 uppercase tracking-widest mb-5">Current Routine</h4>
                            
                            <div className="space-y-5">
                                <div className="flex items-center gap-4">
                                    <div className="w-2.5 h-2.5 rounded-full bg-slate-300 ring-4 ring-slate-100"></div>
                                    <div className="flex-1 border-b border-slate-100 pb-2">
                                        <p className="text-sm font-bold text-slate-700">Anand Sahib</p>
                                    </div>
                                    <p className="text-sm font-semibold text-slate-500 text-right">Prior to<br/>Ardas</p>
                                </div>
                                
                                <div className="flex items-center gap-4">
                                    <div className="w-2.5 h-2.5 rounded-full bg-amber-400 ring-4 ring-amber-50"></div>
                                    <div className="flex-1 border-b border-slate-100 pb-2">
                                        <p className="text-sm font-bold text-slate-700">First Ardas</p>
                                    </div>
                                    <p className="text-sm font-bold text-amber-600">{ardaasData.time}</p>
                                </div>
                            </div>
                        </div>

                        {/* Footer */}
                        <div className="text-center pt-4 pb-2 flex justify-center items-center gap-1.5 opacity-60">
                            <IconInfo className="w-3.5 h-3.5 text-slate-500" />
                            <p className="text-[10px] font-medium text-slate-500 tracking-wide uppercase">Source: goldentempleamritsar.org</p>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
