<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmandir Sahib Amritvela</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* ===== DARK MODE BODY ===== */
        body { transition: background 0.4s ease, color 0.4s ease; }
        body.light { background: linear-gradient(to bottom, #e0f2fe, #fffbeb55, #ffffff); color: #1e293b; }
        body.dark  { background: linear-gradient(to bottom, #020617, #0f172a, #020617); color: #f1f5f9; }

        /* ===== TOAST ANIMATIONS ===== */
        @keyframes toastIn  { from { transform: translateY(-110%) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        @keyframes toastOut { from { transform: translateY(0) scale(1); opacity: 1; } to { transform: translateY(-110%) scale(0.95); opacity: 0; } }
        .toast-in  { animation: toastIn  0.35s cubic-bezier(0.34,1.56,0.64,1) forwards; }
        .toast-out { animation: toastOut 0.3s ease forwards; }

        /* ===== NOW PULSE ===== */
        @keyframes nowPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); } 50% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } }
        .now-pulse { animation: nowPulse 1.8s ease infinite; }

        /* ===== COUNTDOWN NUMBERS ===== */
        @keyframes numTick { from { transform: translateY(-4px); opacity: 0.6; } to { transform: translateY(0); opacity: 1; } }
        .num-tick { animation: numTick 0.12s ease; }

        /* ===== NUDGE SLIDE UP ===== */
        @keyframes nudgeUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .nudge-up { animation: nudgeUp 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; }

        /* ===== VOLUME SLIDER ===== */
        input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 99px; outline: none; }
        input[type=range].light-range { background: linear-gradient(to right, #f59e0b var(--vp,80%), #e2e8f0 var(--vp,80%)); }
        input[type=range].dark-range  { background: linear-gradient(to right, #d97706 var(--vp,80%), #334155 var(--vp,80%)); }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #f59e0b; cursor: pointer; box-shadow: 0 0 0 4px rgba(245,158,11,0.2); transition: box-shadow 0.2s; }
        input[type=range]:active::-webkit-slider-thumb { box-shadow: 0 0 0 6px rgba(245,158,11,0.3); }

        /* ===== CARD TRANSITIONS ===== */
        .card { transition: background-color 0.4s ease, border-color 0.4s ease; }

        /* ===== 7-DAY BAR ===== */
        @keyframes barFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
        .bar-fill { animation: barFill 0.6s ease forwards; transform-origin: left; }

        /* ===== GLOW ===== */
        @keyframes glowPulse { 0%,100% { opacity: 0.35; } 50% { opacity: 0.55; } }
        .glow-pulse { animation: glowPulse 3s ease infinite; }
    </style>
</head>
<body class="light min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbwy3zfHhikZSKwup6PJgpa_0kD8jdSY7mNEe1VyM_SfHH4LB2fXRSyF5I7y0p72QB7nCQ/exec";
        const CACHE_KEY   = "hsa_ardaas_cache";
        const DARK_KEY    = "hsa_dark_mode";

        // ==================== SVG ICONS ====================
        const Ic = (d, fill) => ({ className }) =>
            <svg viewBox="0 0 24 24" fill={fill||"none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{__html: d}} />;

        const IconRefresh  = Ic('<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>');
        const IconSparkles = Ic('<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>');
        const IconCheck    = Ic('<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>');
        const IconBell     = Ic('<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>');
        const IconPlay     = Ic('<polygon points="5 3 19 12 5 21 5 3"/>', 'currentColor');
        const IconPause    = Ic('<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>', 'currentColor');
        const IconInfo     = Ic('<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>');
        const IconYoutube  = Ic('<path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33 2.78 2.78 0 0 0 1.94 2c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02" fill="currentColor"/>');
        const IconWa       = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>;
        const IconMoon     = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>;
        const IconSun      = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;

        // ==================== UTILITIES ====================

        // Parse "4:15 AM", "04:15", "4:15" → { hours, minutes } in 24h
        function parseTime(str) {
            if (!str || str === '--:--' || str === 'Error') return null;
            const m = str.match(/(\d+):(\d+)\s*(AM|PM)?/i);
            if (!m) return null;
            let h = parseInt(m[1]), min = parseInt(m[2]);
            const ap = (m[3] || '').toUpperCase();
            if (ap === 'PM' && h !== 12) h += 12;
            if (ap === 'AM' && h === 12) h = 0;
            return { hours: h, minutes: min };
        }

        // Reformat to "4:15 AM" cleanly
        function fmtTime(str) {
            const p = parseTime(str);
            if (!p) return str;
            const ap = p.hours >= 12 ? 'PM' : 'AM';
            const dh = p.hours > 12 ? p.hours - 12 : (p.hours === 0 ? 12 : p.hours);
            return `${dh}:${String(p.minutes).padStart(2,'0')} ${ap}`;
        }

        // Subtract minutes from a time string, return display string
        function subtractMinutes(str, delta) {
            const p = parseTime(str);
            if (!p) return null;
            let tot = p.hours * 60 + p.minutes - delta;
            if (tot < 0) tot += 1440;
            const h = Math.floor(tot / 60), mn = tot % 60;
            const ap = h >= 12 ? 'PM' : 'AM';
            const dh = h > 12 ? h - 12 : (h === 0 ? 12 : h);
            return `${dh}:${String(mn).padStart(2,'0')} ${ap}`;
        }

        // Get current total seconds in IST
        function istSeconds() {
            const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
            return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
        }

        // Countdown: returns { text, status: 'upcoming'|'now'|'past'|'tomorrow'|'loading' }
        function calcCountdown(timeStr) {
            const p = parseTime(timeStr);
            if (!p) return { text: '--', status: 'loading' };
            const ardaas = p.hours * 3600 + p.minutes * 60;
            let diff = ardaas - istSeconds();

            // Within ±5 min window = happening NOW
            if (diff >= -300 && diff <= 300) {
                return { text: '🙏 Happening NOW', status: 'now' };
            }
            // Still ahead today
            if (diff > 300) {
                const h = Math.floor(diff / 3600);
                const m = Math.floor((diff % 3600) / 60);
                const s = diff % 60;
                if (h > 0)  return { text: `in ${h}h ${m}m`, status: 'upcoming' };
                if (m >= 1) return { text: `in ${m}m ${String(s).padStart(2,'0')}s`, status: 'upcoming' };
                return { text: `in ${s}s`, status: 'upcoming' };
            }
            // Past today → wrap to tomorrow
            diff += 86400;
            const h = Math.floor(diff / 3600);
            const m = Math.floor((diff % 3600) / 60);
            return { text: `Tomorrow · ${h}h ${m}m`, status: 'tomorrow' };
        }

        // 7-day log array (oldest → newest)
        function sevenDayLog(timeStr, daysActive) {
            const labels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            const today  = new Date();
            return Array.from({ length: 7 }, (_, i) => {
                const daysAgo = 6 - i;
                const d = new Date(today); d.setDate(d.getDate() - daysAgo);
                const known = daysAgo < daysActive;
                return { label: labels[d.getDay()], isToday: daysAgo === 0, known, time: known ? fmtTime(timeStr) : null };
            });
        }

        function relTime(date) {
            if (!date) return null;
            const s = Math.floor((Date.now() - date) / 1000);
            if (s < 15)   return 'just now';
            if (s < 60)   return `${s}s ago`;
            if (s < 3600) return `${Math.floor(s/60)}m ago`;
            return `${Math.floor(s/3600)}h ago`;
        }

        function fmtSleep(sec) {
            return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
        }

        function initDark() {
            const saved = localStorage.getItem(DARK_KEY);
            if (saved !== null) return saved === 'true';
            const h = new Date().getHours();
            return h >= 20 || h < 6;
        }

        // ==================== TOAST COMPONENT ====================

        function ToastBar({ toasts }) {
            return (
                <div className="fixed top-3 left-0 right-0 z-50 flex flex-col items-center gap-2 pointer-events-none px-4">
                    {toasts.map(t => (
                        <div key={t.id} className={`toast-in pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl text-sm font-semibold shadow-2xl border max-w-sm w-full ${
                            t.type === 'error'   ? 'bg-red-500 border-red-400 text-white' :
                            t.type === 'warning' ? 'bg-amber-500 border-amber-400 text-white' :
                            t.type === 'success' ? 'bg-emerald-500 border-emerald-400 text-white' :
                                                   'bg-slate-900 border-slate-700 text-white'
                        }`}>
                            <span>{t.icon}</span>
                            <span className="flex-1">{t.message}</span>
                        </div>
                    ))}
                </div>
            );
        }

        // ==================== MAIN APP ====================

        const App = () => {
            // — Core data —
            const [isLoading,    setIsLoading]    = useState(true);
            const [ardaasData,   setArdaasData]   = useState({ time: '--:--', daysActive: 0 });
            const [isRefreshing, setIsRefreshing] = useState(false);
            const [errorMsg,     setErrorMsg]     = useState(null);
            const [lastFetched,  setLastFetched]  = useState(null);   // timestamp ms
            const [lastFetchTxt, setLastFetchTxt] = useState(null);
            const [fromCache,    setFromCache]    = useState(false);

            // — Dark mode —
            const [dark, setDark] = useState(initDark);

            // — Countdown —
            const [cd, setCd] = useState({ text: '--', status: 'loading' });

            // — Audio —
            const [isPlaying,     setIsPlaying]     = useState(false);
            const [audioLoading,  setAudioLoading]  = useState(false);
            const [activeStream,  setActiveStream]  = useState(null); // 'primary'|'backup'
            const [volume,        setVolume]        = useState(0.8);
            const audioRef = useRef(null);

            // — Sleep timer —
            const [sleepSec,       setSleepSec]       = useState(null);
            const [showSleepPick,  setShowSleepPick]  = useState(false);
            const sleepRef = useRef(null);

            // — Toasts —
            const [toasts, setToasts] = useState([]);

            // — Refresh rate limit —
            const lastRefreshTs = useRef(0);

            // --------- helpers ---------
            const toast = useCallback((message, type = 'info', icon = '') => {
                const id = Date.now() + Math.random();
                setToasts(p => [...p, { id, message, type, icon }]);
                setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 5000);
            }, []);

            // --------- dark mode ---------
            useEffect(() => {
                document.body.className = dark ? 'dark min-h-screen font-sans' : 'light min-h-screen font-sans';
                localStorage.setItem(DARK_KEY, dark);
            }, [dark]);

            // Auto-dark between 8 PM – 6 AM (recheck on mount)
            useEffect(() => {
                const h = new Date().getHours();
                const shouldBeDark = h >= 20 || h < 6;
                const saved = localStorage.getItem(DARK_KEY);
                if (saved === null) setDark(shouldBeDark); // only if user hasn't overridden
            }, []);

            // --------- fetch ---------
            const doFetch = useCallback(async () => {
                const ctrl = new AbortController();
                const tid  = setTimeout(() => ctrl.abort(), 8000); // 8s timeout
                try {
                    const res  = await fetch(`${GOOGLE_API_URL}?nocache=${Date.now()}`, { redirect:'follow', cache:'no-store', signal: ctrl.signal });
                    clearTimeout(tid);
                    const txt  = await res.text();
                    if (txt.trim().startsWith('<')) {
                        setErrorMsg('Google Access Denied. Check deployment settings.');
                        setArdaasData({ time: 'Error', daysActive: 0 });
                    } else {
                        const data = JSON.parse(txt);
                        const next = { time: data.time || '--:--', daysActive: data.daysActive || 0 };
                        setArdaasData(next);
                        setErrorMsg(null);
                        const now = Date.now();
                        setLastFetched(now);
                        setFromCache(false);
                        localStorage.setItem(CACHE_KEY, JSON.stringify({ ...next, at: now }));
                    }
                } catch (err) {
                    clearTimeout(tid);
                    const cached = localStorage.getItem(CACHE_KEY);
                    if (cached) {
                        const c = JSON.parse(cached);
                        setArdaasData({ time: c.time, daysActive: c.daysActive || 0 });
                        setLastFetched(c.at);
                        setFromCache(true);
                        setErrorMsg(null);
                        toast(err.name === 'AbortError' ? 'Connection timed out — showing cached timing' : 'Offline — showing last known timing', 'warning', '⚠️');
                    } else {
                        setErrorMsg(err.name === 'AbortError' ? 'Timed out. Check your connection.' : 'Network error. Check the script URL.');
                        setArdaasData({ time: 'Error', daysActive: 0 });
                    }
                } finally {
                    setIsLoading(false);
                    setIsRefreshing(false);
                }
            }, [toast]);

            useEffect(() => {
                doFetch();
                const onVisible = () => { if (document.visibilityState === 'visible') { setIsRefreshing(true); doFetch(); } };
                document.addEventListener('visibilitychange', onVisible);
                return () => document.removeEventListener('visibilitychange', onVisible);
            }, [doFetch]);

            const handleRefresh = () => {
                const now = Date.now();
                if (now - lastRefreshTs.current < 10000) { toast('Wait a moment before refreshing again.', 'info', '⏳'); return; }
                lastRefreshTs.current = now;
                setIsRefreshing(true);
                doFetch();
            };

            // --------- countdown ticker ---------
            useEffect(() => {
                if (!ardaasData.time || ardaasData.time === '--:--' || ardaasData.time === 'Error') return;
                const tick = () => setCd(calcCountdown(ardaasData.time));
                tick();
                const id = setInterval(tick, 1000);
                return () => clearInterval(id);
            }, [ardaasData.time]);

            // --------- last-fetched relative text ticker ---------
            useEffect(() => {
                setLastFetchTxt(relTime(lastFetched));
                const id = setInterval(() => setLastFetchTxt(relTime(lastFetched)), 30000);
                return () => clearInterval(id);
            }, [lastFetched]);

            // --------- audio ---------
            useEffect(() => {
                const audio = audioRef.current;
                if (!audio) return;
                const onEnded = () => { setIsPlaying(false); setActiveStream(null); toast('Stream ended.', 'info', '📻'); };
                const onError = () => { if (isPlaying) { setIsPlaying(false); setActiveStream(null); toast('Stream disconnected. Tap to reconnect.', 'error', '🔴'); } };
                audio.addEventListener('ended', onEnded);
                audio.addEventListener('error', onError);
                return () => { audio.removeEventListener('ended', onEnded); audio.removeEventListener('error', onError); };
            }, [isPlaying, toast]);

            const setupMediaSession = useCallback((stream) => {
                if (!('mediaSession' in navigator)) return;
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Sri Harmandir Sahib',
                    artist: `Live Gurbani Kirtan · ${stream === 'primary' ? 'Zeno' : 'SGPC'}`,
                    album:  'Amritvela'
                });
                navigator.mediaSession.setActionHandler('play',  () => setIsPlaying(true));
                navigator.mediaSession.setActionHandler('pause', () => { audioRef.current?.pause(); setIsPlaying(false); setActiveStream(null); });
            }, []);

            const toggleAudio = useCallback(() => {
                const audio = audioRef.current;
                if (!audio) return;
                if (isPlaying) {
                    audio.pause();
                    setIsPlaying(false);
                    setAudioLoading(false);
                    setActiveStream(null);
                    setShowSleepPick(false);
                    return;
                }
                setAudioLoading(true);
                audio.src = 'https://stream.zeno.fm/f3qf42zz81zuv';
                audio.volume = volume;
                audio.load();
                audio.play()
                    .then(() => { setIsPlaying(true); setAudioLoading(false); setActiveStream('primary'); setupMediaSession('primary'); })
                    .catch(() => {
                        audio.src = 'https://live.sgpc.net:8443/;';
                        audio.load();
                        audio.play()
                            .then(() => { setIsPlaying(true); setAudioLoading(false); setActiveStream('backup'); setupMediaSession('backup'); })
                            .catch(() => { setAudioLoading(false); toast('Live audio servers are offline. Use YouTube instead.', 'error', '🔴'); });
                    });
            }, [isPlaying, volume, setupMediaSession, toast]);

            const onVolumeChange = (e) => {
                const v = parseFloat(e.target.value);
                setVolume(v);
                if (audioRef.current) audioRef.current.volume = v;
                e.target.style.setProperty('--vp', `${v * 100}%`);
            };

            // --------- sleep timer ---------
            const startSleepTimer = (min) => {
                if (sleepRef.current) clearInterval(sleepRef.current);
                let rem = min * 60;
                setSleepSec(rem);
                setShowSleepPick(false);
                toast(`Sleep timer set for ${min} minutes.`, 'success', '😴');
                sleepRef.current = setInterval(() => {
                    rem--;
                    setSleepSec(rem);
                    if (rem <= 0) {
                        clearInterval(sleepRef.current);
                        audioRef.current?.pause();
                        setIsPlaying(false);
                        setActiveStream(null);
                        setSleepSec(null);
                        toast('Sleep timer ended. Audio stopped.', 'info', '😴');
                    }
                }, 1000);
            };

            const cancelSleep = () => {
                clearInterval(sleepRef.current);
                setSleepSec(null);
                setShowSleepPick(false);
            };

            // --------- share ---------
            const shareWA = () => {
                const t = fmtTime(ardaasData.time);
                const msg = `🙏 *Sri Harmandir Sahib — Amritvela*\n\nFirst Ardas today: *${t} IST*\n\nWaheguru Ji Ka Khalsa, Waheguru Ji Ki Fateh 🙏`;
                const a = document.createElement('a');
                a.href = `https://wa.me/?text=${encodeURIComponent(msg)}`;
                a.target = '_blank'; a.rel = 'noopener noreferrer';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            };

            const YT_URL = 'https://www.youtube.com/results?search_query=sgpc+live&sp=EgJAAQ%3D%3D';

            // --------- computed ---------
            const goodTime    = ardaasData.time && ardaasData.time !== '--:--' && ardaasData.time !== 'Error';
            const displayTime = goodTime ? fmtTime(ardaasData.time) : ardaasData.time;
            const ishnaanTime = goodTime ? subtractMinutes(ardaasData.time, 30) : null;
            const log7        = goodTime && ardaasData.daysActive > 0 ? sevenDayLog(ardaasData.time, ardaasData.daysActive) : null;

            // --------- theme helpers ---------
            const D  = dark;
            const c  = (light, dk) => D ? dk : light;
            const bg = c('bg-white',      'bg-slate-800');
            const bd = c('border-slate-200', 'border-slate-700');
            const t1 = c('text-slate-800', 'text-slate-100');
            const t2 = c('text-slate-500', 'text-slate-400');
            const am = c('text-amber-600', 'text-amber-400');

            return (
                <div className="p-4 sm:p-6 flex justify-center min-h-screen">
                    <audio ref={audioRef} preload="none" />

                    {/* ===== TOASTS ===== */}
                    <ToastBar toasts={toasts} />

                    {/* ===== MAIN COLUMN ===== */}
                    <div className="w-full max-w-sm space-y-4 relative z-10 pt-2 pb-8">

                        {/* ── HEADER ── */}
                        <div className="flex justify-between items-center px-1">
                            <div>
                                <h1 className={`font-bold text-xl tracking-wide font-serif ${am}`}>Sri Harmandir Sahib</h1>
                                <p className={`text-[10px] uppercase tracking-widest font-bold mt-0.5 ${c('text-sky-700/70','text-sky-400/70')}`}>Amritvela Routine</p>
                            </div>
                            <div className="flex items-center gap-2">
                                <button
                                    onClick={() => setDark(d => !d)}
                                    title={dark ? 'Switch to light mode' : 'Switch to dark mode'}
                                    className={`p-2.5 rounded-full shadow-sm border transition-all ${c('bg-white border-amber-100 text-slate-500 hover:bg-amber-50','bg-slate-700 border-slate-600 text-amber-400 hover:bg-slate-600')}`}
                                >
                                    {dark ? <IconSun className="w-4 h-4" /> : <IconMoon className="w-4 h-4" />}
                                </button>
                                <button
                                    onClick={handleRefresh}
                                    className={`p-2.5 rounded-full shadow-sm border transition-all ${c('bg-white border-amber-100 hover:bg-amber-50','bg-slate-700 border-slate-600 hover:bg-slate-600')} ${isRefreshing ? 'animate-spin' : ''} ${am}`}
                                >
                                    <IconRefresh className="w-4 h-4" />
                                </button>
                            </div>
                        </div>

                        {/* ── HERO ARDAS CARD ── */}
                        <div className="relative group">
                            <div className={`absolute -inset-1.5 rounded-[2.2rem] blur-lg glow-pulse ${c('bg-gradient-to-b from-amber-200 to-amber-400','bg-gradient-to-b from-amber-900 to-amber-700')} opacity-40`}></div>
                            <div className={`relative border rounded-[2rem] p-7 text-center shadow-2xl flex flex-col items-center ${c('bg-gradient-to-b from-white to-amber-50/60 border-amber-200/60','bg-gradient-to-b from-slate-800 to-slate-900 border-amber-900/50')}`}>

                                <IconSparkles className={`w-7 h-7 mx-auto mb-2 ${am}`} />
                                <p className={`text-[10px] font-extrabold uppercase tracking-[0.18em] mb-1 ${c('text-amber-800/70','text-amber-500/70')}`}>First Ardas · IST</p>

                                {/* Time display */}
                                {isLoading ? (
                                    <div className="h-16 flex items-center justify-center">
                                        <div className={`w-9 h-9 border-4 rounded-full animate-spin ${c('border-amber-200 border-t-amber-500','border-slate-600 border-t-amber-400')}`}></div>
                                    </div>
                                ) : (
                                    <div className={`text-5xl font-black tracking-tight my-2 font-serif ${t1}`}>
                                        {displayTime}
                                    </div>
                                )}

                                {/* Countdown badge */}
                                {!isLoading && !errorMsg && (
                                    <div className={`mt-1 px-4 py-1.5 rounded-full text-sm font-bold flex items-center gap-2 transition-all ${
                                        cd.status === 'now'     ? 'bg-green-500 text-white now-pulse' :
                                        cd.status === 'tomorrow'? c('bg-slate-100 text-slate-500','bg-slate-700 text-slate-400') :
                                                                  c('bg-amber-100 text-amber-800','bg-amber-900/40 text-amber-300')
                                    }`}>
                                        {cd.status === 'upcoming' && '⏱'} {cd.text}
                                    </div>
                                )}

                                {/* Error */}
                                {errorMsg && (
                                    <div className="mt-3 bg-red-50 border border-red-200 text-red-600 text-xs font-bold p-3 rounded-xl max-w-[240px] leading-relaxed">
                                        {errorMsg}
                                    </div>
                                )}

                                {/* Days active + last updated + cache badge */}
                                {!isLoading && !errorMsg && (
                                    <div className="mt-4 flex flex-col items-center gap-1.5">
                                        <div className={`px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 border shadow-sm ${
                                            ardaasData.daysActive === 0
                                                ? c('bg-amber-100 border-amber-300 text-amber-800','bg-amber-900/40 border-amber-700 text-amber-300')
                                                : c('bg-white border-slate-200 text-slate-500','bg-slate-700 border-slate-600 text-slate-400')
                                        }`}>
                                            {ardaasData.daysActive === 0 ? (
                                                <><IconCheck className="w-3.5 h-3.5" /> Changed Today!</>
                                            ) : (
                                                `Same timing for ${ardaasData.daysActive} day${ardaasData.daysActive !== 1 ? 's' : ''}`
                                            )}
                                        </div>
                                        {lastFetchTxt && (
                                            <p className={`text-[10px] flex items-center gap-1 ${t2}`}>
                                                {fromCache && <span className="text-amber-500">⚠️ Cached ·</span>}
                                                Updated {lastFetchTxt}
                                            </p>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* ── 7-DAY TIMING LOG ── */}
                        {log7 && (
                            <div className={`card border ${bd} ${bg} rounded-2xl p-4 shadow-sm`}>
                                <h4 className={`text-[9px] font-extrabold uppercase tracking-widest mb-3 ${c('text-amber-800/50','text-amber-500/50')}`}>7-Day Timing Log</h4>
                                <div className="grid grid-cols-7 gap-1.5">
                                    {log7.map((day, i) => (
                                        <div key={i} className="flex flex-col items-center gap-1">
                                            <p className={`text-[8px] font-bold uppercase ${day.isToday ? am : t2}`}>{day.label}</p>
                                            <div className={`w-full h-1 rounded-full overflow-hidden ${c('bg-slate-100','bg-slate-700')}`}>
                                                {day.known && <div className="h-full bg-amber-400 bar-fill"></div>}
                                            </div>
                                            <p className={`text-[7px] font-semibold text-center leading-tight ${day.known ? am : c('text-slate-300','text-slate-600')}`}>
                                                {day.known ? day.time.replace(/\s?(AM|PM)/, '') : '–'}
                                            </p>
                                        </div>
                                    ))}
                                </div>
                                <p className={`text-[8px] mt-2 ${t2}`}>🟡 Amber bar = confirmed same timing as today</p>
                            </div>
                        )}

                        {/* ── CALENDAR NOTIFICATION CARD (REWORDED) ── */}
                        <div className={`card border rounded-2xl p-4 flex items-start gap-3 shadow-sm ${c('bg-emerald-50 border-emerald-100','bg-emerald-950/40 border-emerald-900')}`}>
                            <div className={`p-2 rounded-xl border shadow-sm flex-shrink-0 ${c('bg-white text-emerald-600 border-emerald-100','bg-slate-800 text-emerald-400 border-emerald-900')}`}>
                                <IconBell className="w-5 h-5" />
                            </div>
                            <div className="flex-1">
                                <h3 className={`font-bold text-sm ${c('text-slate-800','text-emerald-300')}`}>Admin Calendar Reminder</h3>
                                <p className={`text-xs mt-1 leading-relaxed ${t2}`}>
                                    The GAS backend sends a Calendar alert <strong className={c('text-emerald-700','text-emerald-400')}>5 min before Ardas</strong> to the admin account only. Want your own?
                                </p>
                                <a
                                    href="https://calendar.google.com/calendar/r/eventedit?text=First+Ardas+%F0%9F%99%8F+Harmandir+Sahib&details=Amritvela+First+Ardas+—+Sri+Harmandir+Sahib&location=Amritsar,+Punjab,+India"
                                    target="_blank" rel="noopener noreferrer"
                                    className={`mt-2 inline-flex items-center gap-1 text-[10px] font-bold uppercase tracking-wide rounded-lg px-2.5 py-1.5 transition-all ${c('bg-emerald-100 text-emerald-700 hover:bg-emerald-200','bg-emerald-900/50 text-emerald-400 hover:bg-emerald-900')}`}
                                >
                                    + Add to my Google Calendar
                                </a>
                            </div>
                        </div>

                        {/* ── AUDIO + YOUTUBE BUTTONS ── */}
                        <div className="grid grid-cols-2 gap-3">
                            {/* Audio */}
                            <button
                                onClick={toggleAudio}
                                disabled={audioLoading}
                                className={`card border rounded-2xl p-4 flex flex-col items-center justify-center gap-2 transition-all relative overflow-hidden ${
                                    isPlaying
                                        ? c('border-amber-400 bg-amber-50','border-amber-600 bg-slate-700')
                                        : c('border-slate-200 bg-white hover:bg-slate-50','border-slate-700 bg-slate-800 hover:bg-slate-700')
                                } shadow-sm ${audioLoading ? 'opacity-60 cursor-not-allowed' : 'cursor-pointer'}`}
                            >
                                {isPlaying && (
                                    <div className={`absolute inset-0 animate-pulse opacity-20 ${c('bg-amber-300','bg-amber-700')}`}></div>
                                )}
                                <div className={`p-3 rounded-full transition-colors relative z-10 ${isPlaying ? c('bg-amber-200','bg-amber-900/60') : c('bg-amber-50','bg-slate-700')}`}>
                                    {audioLoading
                                        ? <div className={`w-5 h-5 border-2 rounded-full animate-spin ${c('border-amber-200 border-t-amber-600','border-slate-600 border-t-amber-400')}`}></div>
                                        : isPlaying
                                            ? <IconPause className={`w-5 h-5 ${am}`} />
                                            : <IconPlay  className={`w-5 h-5 ${am}`} />
                                    }
                                </div>
                                <span className={`text-xs font-bold text-center relative z-10 ${t1}`}>
                                    {audioLoading ? 'Connecting…' : isPlaying ? 'Pause Kirtan' : 'Live Kirtan'}
                                </span>
                                {/* Stream badge */}
                                {isPlaying && activeStream && (
                                    <span className={`text-[9px] font-bold px-2 py-0.5 rounded-full relative z-10 ${
                                        activeStream === 'primary'
                                            ? c('bg-green-100 text-green-700','bg-green-900/50 text-green-400')
                                            : c('bg-orange-100 text-orange-700','bg-orange-900/50 text-orange-400')
                                    }`}>
                                        ● {activeStream === 'primary' ? 'Zeno HD' : 'SGPC Backup'}
                                    </span>
                                )}
                            </button>

                            {/* YouTube */}
                            <a
                                href={YT_URL}
                                target="_blank"
                                rel="noopener noreferrer"
                                className={`card border rounded-2xl p-4 flex flex-col items-center justify-center gap-2 transition-all shadow-sm ${c('border-slate-200 bg-white hover:bg-red-50','border-slate-700 bg-slate-800 hover:bg-slate-700')}`}
                            >
                                <div className={`p-3 rounded-full ${c('bg-red-50','bg-red-900/30')}`}>
                                    <IconYoutube className="w-5 h-5 text-red-500" />
                                </div>
                                <span className={`text-xs font-bold text-center ${t1}`}>YouTube<br/>Live</span>
                            </a>
                        </div>

                        {/* ── VOLUME + SLEEP TIMER (only while playing) ── */}
                        {isPlaying && (
                            <div className={`card border ${bd} ${bg} rounded-2xl p-4 space-y-3 shadow-sm`}>
                                {/* Volume row */}
                                <div className="flex items-center gap-3">
                                    <span className="text-sm select-none">🔈</span>
                                    <input
                                        type="range" min="0" max="1" step="0.02"
                                        value={volume}
                                        onChange={onVolumeChange}
                                        className={`flex-1 ${D ? 'dark-range' : 'light-range'}`}
                                        style={{ '--vp': `${volume*100}%` }}
                                    />
                                    <span className="text-sm select-none">🔊</span>
                                </div>

                                {/* Sleep timer row */}
                                <div className="flex items-center gap-2">
                                    <span className={`text-xs font-semibold flex-1 ${t2}`}>
                                        {sleepSec !== null ? `😴 Stops in ${fmtSleep(sleepSec)}` : 'Sleep timer'}
                                    </span>
                                    {sleepSec !== null ? (
                                        <button onClick={cancelSleep} className={`text-[10px] font-bold px-2.5 py-1 rounded-lg ${c('bg-slate-100 text-slate-600','bg-slate-700 text-slate-300')}`}>Cancel</button>
                                    ) : showSleepPick ? (
                                        <div className="flex items-center gap-1.5">
                                            {[15, 30, 60].map(m => (
                                                <button key={m} onClick={() => startSleepTimer(m)} className={`text-[10px] font-bold px-2.5 py-1 rounded-lg ${c('bg-amber-100 text-amber-700','bg-amber-900/50 text-amber-300')}`}>{m}m</button>
                                            ))}
                                            <button onClick={() => setShowSleepPick(false)} className={`text-[10px] font-bold px-2 py-1 rounded-lg ${c('bg-slate-100 text-slate-500','bg-slate-700 text-slate-400')}`}>✕</button>
                                        </div>
                                    ) : (
                                        <button onClick={() => setShowSleepPick(true)} className={`text-[10px] font-bold px-2.5 py-1 rounded-lg ${c('bg-slate-100 text-slate-600','bg-slate-700 text-slate-300')}`}>Set timer</button>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* ── WHATSAPP SHARE ── */}
                        {goodTime && (
                            <button
                                onClick={shareWA}
                                className={`w-full card border rounded-2xl p-3.5 flex items-center justify-center gap-3 transition-all shadow-sm ${c('border-slate-200 bg-white hover:bg-green-50 hover:border-green-200','border-slate-700 bg-slate-800 hover:bg-slate-700')}`}
                            >
                                <IconWa className={`w-5 h-5 ${c('text-green-600','text-green-500')}`} />
                                <span className={`text-sm font-bold ${t1}`}>Share Today's Timing</span>
                                <span className={`text-[10px] font-bold ml-auto uppercase tracking-wide ${c('text-green-600','text-green-500')}`}>WhatsApp</span>
                            </button>
                        )}

                        {/* ── ROUTINE LIST ── */}
                        <div className={`card border ${bd} ${bg} rounded-3xl p-5 shadow-sm`}>
                            <h4 className={`text-[9px] font-extrabold uppercase tracking-widest mb-4 ${c('text-amber-800/50','text-amber-500/50')}`}>Today's Routine</h4>
                            <div className="space-y-4">

                                {/* Ishnaan */}
                                {ishnaanTime && (
                                    <div className="flex items-center gap-3">
                                        <div className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ring-4 ${c('bg-sky-300 ring-sky-50','bg-sky-500 ring-sky-900/30')}`}></div>
                                        <div className={`flex-1 border-b pb-1.5 ${c('border-slate-100','border-slate-700')}`}>
                                            <p className={`text-sm font-bold ${t1}`}>Ishnaan <span className={`font-normal text-xs ${t2}`}>(bath)</span></p>
                                        </div>
                                        <p className={`text-sm font-semibold ${c('text-sky-600','text-sky-400')}`}>by {ishnaanTime}</p>
                                    </div>
                                )}

                                {/* Anand Sahib */}
                                <div className="flex items-center gap-3">
                                    <div className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ring-4 ${c('bg-slate-300 ring-slate-100','bg-slate-600 ring-slate-700')}`}></div>
                                    <div className={`flex-1 border-b pb-1.5 ${c('border-slate-100','border-slate-700')}`}>
                                        <p className={`text-sm font-bold ${t1}`}>Anand Sahib</p>
                                    </div>
                                    <p className={`text-sm font-semibold ${t2}`}>Prior to Ardas</p>
                                </div>

                                {/* First Ardas */}
                                <div className="flex items-center gap-3">
                                    <div className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ring-4 ${c('bg-amber-400 ring-amber-50','bg-amber-500 ring-amber-900/30')}`}></div>
                                    <div className={`flex-1 border-b pb-1.5 ${c('border-slate-100','border-slate-700')}`}>
                                        <p className={`text-sm font-bold ${t1}`}>First Ardas</p>
                                    </div>
                                    <p className={`text-sm font-bold ${am}`}>{displayTime}</p>
                                </div>
                            </div>
                        </div>

                        {/* ── LOCK SCREEN TIP (only while audio playing) ── */}
                        {isPlaying && (
                            <div className={`card border rounded-2xl p-3 flex items-start gap-2.5 ${c('bg-blue-50 border-blue-100 text-blue-700','bg-blue-950/40 border-blue-900 text-blue-300')}`}>
                                <span className="text-base mt-0.5">💡</span>
                                <p className="text-xs font-medium leading-relaxed">
                                    Use headphone controls or keep screen on to prevent audio stopping when your screen locks. Lock screen media controls are active.
                                </p>
                            </div>
                        )}

                        {/* ── FOOTER ── */}
                        <div className={`text-center pt-2 pb-1 flex justify-center items-center gap-1.5 opacity-40`}>
                            <IconInfo className={`w-3 h-3 ${t2}`} />
                            <p className={`text-[9px] font-semibold uppercase tracking-widest ${t2}`}>Source: goldentempleamritsar.org</p>
                        </div>

                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
